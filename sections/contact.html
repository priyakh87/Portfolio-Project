 <div class="container contact-layout" >
     <div class="contact-copy" data-reveal>
         <p class="section-index">06 / Contact</p>
         <h2 id="contact-title">Have a product problem worth solving?</h2>
         <p>Tell me what you’re building, what is getting in the way and where you need senior frontend
             support.</p>
         <a class="email-link" href="mailto:priyakh87@gmail.com">priyakh87@gmail.com
             <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
         </a>
     </div>

     <form id="contactForm" data-reveal style="--reveal-delay: 80ms" novalidate>
         <div class="form-row">
             <label for="name">Name</label>
             <input id="name" type="text" name="name" autocomplete="name" placeholder="Your name" required>
         </div>
         <div class="form-row">
             <label for="email">Email</label>
             <input id="email" type="email" name="email" autocomplete="email" placeholder="you@company.com" required>
         </div>
         <div class="form-row">
             <div class="label-row">
                 <label for="message">Project details</label>
                 <span id="charCount">0 / 300</span>
             </div>
             <textarea id="message" name="message" placeholder="What are you building, and how can I help?"
                 minlength="5" maxlength="300" required></textarea>
         </div>
         <button class="btn primary form-submit" type="submit">Send project enquiry
             <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
         </button>
         <p id="status" class="form-status" role="status" aria-live="polite"></p>
     </form>
 </div>
